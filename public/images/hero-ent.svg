<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C5D" />
      <stop offset="100%" stop-color="#087F8C" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20A779" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EAF9FA" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#heroBg)" rx="24" />
  <circle cx="650" cy="150" r="180" fill="url(#accentGlow)" />
  <circle cx="150" cy="450" r="140" fill="url(#accentGlow)" />
  
  <!-- ENT Care Illustration Graphics -->
  <g transform="translate(250, 120)" stroke="#EAF9FA" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Medical Stethoscope & Otoscope Silhouette -->
    <path d="M 150 60 C 120 60, 90 90, 90 140 C 90 190, 140 220, 150 250 C 160 220, 210 190, 210 140 C 210 90, 180 60, 150 60 Z" fill="#EAF9FA" fill-opacity="0.08" stroke="#EAF9FA" stroke-width="5"/>
    <!-- Otoscope Icon -->
    <circle cx="150" cy="140" r="45" stroke="#F26B5B" stroke-width="6"/>
    <line x1="150" y1="185" x2="150" y2="280" stroke="#EAF9FA" stroke-width="8"/>
    <path d="M 120 280 L 180 280" stroke="#EAF9FA" stroke-width="8"/>
    <!-- Waves -->
    <path d="M 230 110 A 50 50 0 0 1 230 170" stroke="#20A779" stroke-width="5"/>
    <path d="M 250 90 A 80 80 0 0 1 250 190" stroke="#20A779" stroke-width="5"/>
    <path d="M 70 110 A 50 50 0 0 0 70 170" stroke="#20A779" stroke-width="5"/>
  </g>

  <!-- Reassuring Badge overlay -->
  <rect x="50" y="470" width="700" height="90" rx="16" fill="#0B3C5D" fill-opacity="0.8" stroke="#EAF9FA" stroke-opacity="0.2"/>
  <text x="70" y="510" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Specialized ENT Care in Kota</text>
  <text x="70" y="538" font-family="Inter, sans-serif" font-size="15" fill="#D5F3F5">Ear Examination • Nasal Allergy • Throat &amp; Voice Evaluation</text>
</svg>
