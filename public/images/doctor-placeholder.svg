      <stop offset="0%" stop-color="#EAF9FA" />
      <stop offset="100%" stop-color="#D5F3F5" />
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#docBg)" rx="24" />
  
  <!-- Silhouette for doctor profile placeholder -->
